<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sahil Jagad — Wildlife and landscape photography</title>
    <meta name="description" content="Wildlife and landscape photography by Sahil Jagad. Kenya, Yellowstone, Central India, Sedona, Glacier National Park and Portugal." />
    <meta name="author" content="Sahil Jagad" />

    <!-- Static cards for crawlers that don't run JavaScript. The app updates
         these per album once it boots; see src/lib/seo.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sahil Jagad" />
    <meta property="og:title" content="Sahil Jagad — Wildlife and landscape photography" />
    <meta property="og:description" content="Wildlife and landscape photography by Sahil Jagad." />
    <meta property="og:image" content="og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sahil Jagad — Wildlife and landscape photography" />
    <meta name="twitter:description" content="Wildlife and landscape photography by Sahil Jagad." />
    <meta name="twitter:image" content="og-image.jpg" />

    <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#edefec" media="(prefers-color-scheme: light)" />

    <!-- Ridgeline under a low sun. Inlined so it costs no request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0c0d'/%3E%3Ccircle cx='43' cy='22' r='7' fill='%239bb08f'/%3E%3Cpath d='M6 48l14-19 10 13 7-8 21 25z' fill='%239bb08f' opacity='.9'/%3E%3C/svg%3E"
    />

    <script>
      // Set the theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #e9eae7">
        This gallery needs JavaScript to browse the archive.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
